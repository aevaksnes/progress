name: progress
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  archive: ^4.3.0
  camera: ^0.12.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  local_auth: ^3.0.2
  lucide_icons_flutter: ^3.1.20
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png" 
  min_sdk_android: 21
  
  # --- ADAPTIVE ICON SETTINGS FOR ANDROID ---
  adaptive_icon_background: "#000000"         
  adaptive_icon_foreground: "assets/icon_progress.png" 

flutter_native_splash:
  color: "#000000" 
  image: "assets/icon.png"
  android: true
  ios: true
  
  android_12:
    color: "#000000"
    image: "assets/icon.png"
